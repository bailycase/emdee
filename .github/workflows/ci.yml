name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Checks
        run: ./Checks/run.sh
      - name: Build for Mac
        run: xcodebuild build -project emdee.xcodeproj -scheme 'emdee (Dev)' -destination 'generic/platform=macOS' -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Build for iOS
        run: xcodebuild build -project emdee.xcodeproj -scheme 'emdee (Dev)' -destination 'generic/platform=iOS' -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO | xcbeautify
