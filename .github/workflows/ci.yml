name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Checks
        run: ./Checks/run.sh
      - name: Build for Mac
        run: xcodebuild build -scheme emdee -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Build for iOS
        run: xcodebuild build -scheme emdee -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO | xcbeautify
